<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Coastline Interior Builder</title><style>body{background:#090e17;color:white;font:16px Arial;margin:0;padding:24px}main{max-width:1100px;margin:auto}.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{background:#131d2b;border:1px solid #334155;border-radius:15px;padding:15px}svg{width:100%;background:#050910;border-radius:12px}.lights{opacity:0}.lights.on{opacity:1;filter:drop-shadow(0 0 9px #a855f7)}button{background:#1d2b3c;color:white;border:1px solid #50617b;padding:13px;border-radius:9px;cursor:pointer}button[aria-pressed=true]{background:#593c90;border-color:#d4a7ff}.options{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style></head><body><main><h1>Build Your Interior</h1><p>Tap an option to turn its lights on or off.</p><div class='layout'><div class='panel'><svg id='car' viewBox='0 0 800 500'><rect width='800' height='500' fill='#060b14'/><path d='M80 90 Q400 -20 720 90 L670 230 130 230Z' fill='#172337' stroke='#3c4b60' stroke-width='12'/><path d='M100 260 Q400 205 700 260 L665 370 135 370Z' fill='#263142' stroke='#536073' stroke-width='8'/><path d='M0 260 L135 300 170 500 0 500 M800 260 L665 300 630 500 800 500' fill='#1b2635' stroke='#435166' stroke-width='8'/><path d='M335 360 L465 360 520 500 280 500Z' fill='#313e4d'/><circle cx='245' cy='335' r='80' stroke='#64748b' stroke-width='15' fill='none'/><rect x='380' y='270' width='110' height='70' rx='8' fill='#0d2039'/><g id='dashboard' class='lights'><path d='M340 310 Q500 290 680 320' stroke='#ce80ff' stroke-width='6' fill='none'/></g><g id='console' class='lights'><path d='M350 380 L310 485 M450 380 L490 485' stroke='#ce80ff' stroke-width='6'/></g><g id='doors' class='lights'><path d='M20 310 L145 345 M655 345 L780 310' stroke='#ce80ff' stroke-width='7'/></g><g id='speakers' class='lights'><circle cx='85' cy='400' r='25' stroke='#ce80ff' stroke-width='8' fill='none'/><circle cx='715' cy='400' r='25' stroke='#ce80ff' stroke-width='8' fill='none'/></g><g id='footwell' class='lights'><ellipse cx='245' cy='460' rx='65' ry='20' fill='#8b5cf6'/><ellipse cx='550' cy='460' rx='65' ry='20' fill='#8b5cf6'/></g><g id='moonroof' class='lights'><path d='M210 83 Q400 30 590 83' stroke='#ce80ff' stroke-width='7' fill='none'/></g><g id='handles' class='lights'><path d='M60 340 L110 350 M690 350 L740 340' stroke='#ce80ff' stroke-width='8'/></g><g id='pockets' class='lights'><path d='M60 455 L130 470 M670 470 L740 455' stroke='#ce80ff' stroke-width='8'/></g><g id='stars' class='lights' fill='#e8e9ff'></g></svg><p id='summary'>No upgrades selected</p></div><div class='panel'><h2 id='label'>Close-up</h2><svg id='zoom' viewBox='0 0 800 500'><use href='#car'/></svg><p id='description'>Select an upgrade to see a closer view.</p></div></div><div class='options' id='options'></div><button id='all'>All lights on</button> <button id='clear'>All lights off</button><p>Illustrated working prototype. Final version can use matched vehicle photographs.</p></main><script src='assets/interior-builder.js'></script></body></html>
