<circle cx="1420" cy="260" r="130" stroke-dasharray="36 26"/><circle cx="1420" cy="260" r="88" stroke-dasharray="26 20"/>
<circle cx="180" cy="820" r="140" stroke-dasharray="38 28"/><circle cx="180" cy="820" r="96" stroke-dasharray="28 22"/>
