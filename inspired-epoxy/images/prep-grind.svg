<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Diamond grinding concrete in preparation for epoxy">
<defs>
<linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4e4c48"/><stop offset="1" stop-color="#6e6a63"/></linearGradient>
<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="4"/>
