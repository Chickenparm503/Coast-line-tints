<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Broadcasting decorative flake onto a fresh epoxy coat">
<defs>
<linearGradient id="ep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4f55"/><stop offset=".6" stop-color="#33363b"/><stop offset="1" stop-color="#57595f"/></linearGradient>
<filter id="f1"><feTurbulence type="turbulence" baseFrequency="0.5" numOctaves="2" seed="3"/>
<feColorMatrix type="matrix" values="0 0 0 0 .85  0 0 0 0 .86  0 0 0 0 .88  0 0 0 16 -10"/></filter>
<filter id="f2"><feTurbulence type="turbulence" baseFrequency="0.62" numOctaves="2" seed="10"/>
<feColorMatrix type="matrix" values="0 0 0 0 .09  0 0 0 0 .09  0 0 0 0 .11  0 0 0 17 -10.6"/></filter>
<filter id="f3"><feTurbulence type="turbulence" baseFrequency="0.44" numOctaves="2" seed="17"/>
<feColorMatrix type="matrix" values="0 0 0 0 .72  0 0 0 0 .66  0 0 0 0 .56  0 0 0 15 -9.4"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="half"><path d="M0 0 H1030 Q900 300 1010 520 Q1120 760 950 1000 H0 Z"/></clipPath>
</defs>
<rect width="1600" height="1000" fill="url(#ep)"/>
<rect width="1600" height="1000" fill="url(#gl)"/>
<g clip-path="url(#half)">
<rect width="1600" height="1000" filter="url(#f1)" opacity=".85"/>
<rect width="1600" height="1000" filter="url(#f2)" opacity=".8"/>
<rect width="1600" height="1000" filter="url(#f3)" opacity=".6"/>
</g>
<path d="M1030 0 Q900 300 1010 520 Q1120 760 950 1000" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="6"/>
</svg>