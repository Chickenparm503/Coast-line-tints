<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Glossy commercial epoxy warehouse floor">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101214"/><stop offset="1" stop-color="#1e2226"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3036"/><stop offset=".55" stop-color="#6d747d"/><stop offset="1" stop-color="#a6adb6"/></linearGradient>
<linearGradient id="ref" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f6" stop-opacity=".5"/><stop offset="1" stop-color="#eef2f6" stop-opacity="0"/></linearGradient>
<linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb454" stop-opacity=".35"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1600" height="360" fill="url(#wall)"/>
<rect y="360" width="1600" height="640" fill="url(#floor)"/>
<g opacity=".9">
<rect x="140" y="120" width="200" height="240" rx="4" fill="#0a0c0d"/><rect x="620" y="120" width="200" height="240" rx="4" fill="#0a0c0d"/><rect x="1100" y="120" width="200" height="240" rx="4" fill="#0a0c0d"/>
<rect x="150" y="130" width="180" height="110" fill="#233240"/><rect x="630" y="130" width="180" height="110" fill="#2a3a2c"/><rect x="1110" y="130" width="180" height="110" fill="#3a2f22"/>
</g>
<rect x="140" y="360" width="200" height="300" fill="url(#ref)" opacity=".22"/>
<rect x="620" y="360" width="200" height="330" fill="url(#ref)" opacity=".22"/>
<rect x="1100" y="360" width="200" height="360" fill="url(#ref)" opacity=".22"/>
<g fill="#f5f7fa"><rect x="200" y="40" width="320" height="14" rx="7" opacity=".8"/><rect x="760" y="40" width="320" height="14" rx="7" opacity=".8"/><rect x="1240" y="40" width="240" height="14" rx="7" opacity=".8"/></g>
<rect x="180" y="360" width="360" height="640" fill="url(#ref)" opacity=".16" transform="skewX(-6)"/>
<rect x="740" y="360" width="360" height="640" fill="url(#ref)" opacity=".14" transform="skewX(-6)"/>
<rect x="1260" y="360" width="280" height="640" fill="url(#ref)" opacity=".13" transform="skewX(-6)"/>
<rect y="360" width="1600" height="200" fill="url(#warm)" opacity=".25"/>
<rect x="0" y="920" width="1600" height="8" fill="#f2c230" opacity=".55"/>
</svg>